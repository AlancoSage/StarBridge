# Static website example. Replace server_name and root with your own values.
# For an Internet deployment, enable HTTPS with your own certificate.
server {
    listen 80;
    server_name www.example.com;
    root /var/www/starbridge-community;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https: http:; img-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /config.json {
        add_header Cache-Control no-store;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Optional same-origin proxy when StarBridge runs on this machine.
    # Use "apiBase": "/api/v1" with this route.
    # location /api/v1/ {
    #     proxy_pass http://127.0.0.1:8088;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
