<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>社区账号注册 · Myrinbot</title><link rel="icon" type="image/png" href="/mark.png"><link rel="stylesheet" href="/panel.css"></head>
<body class="register-page"><main class="register-shell">
<a class="register-brand" href="/register" aria-label="注册首页"><img src="/mark.png" width="34" height="34" alt=""><span>Myrinbot</span></a>
<section class="panel register-card"><p class="eyebrow">JOIN YOUR COMMUNITY</p><h1 id="register-title">加入社区</h1><p class="muted register-caption">填写玩家名和邮箱，完成验证后注册账号。</p>
<div id="register-notice" class="notice" role="status"></div>
<form id="register-request-form"><div class="field"><label for="register-player">玩家名</label><input id="register-player" placeholder="例如 Steve" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" required autocomplete="username"><p class="hint">3–16 位字母、数字或下划线。</p></div>
<div class="field"><label for="register-email">邮箱</label><input id="register-email" type="email" maxlength="254" required autocomplete="email" placeholder="用来接收验证码"></div><button id="register-request" type="submit">发送验证码 →</button><button id="register-have-code" class="secondary" type="button">已有申请编号和验证码</button></form>
<form id="register-verify-form" hidden><p id="register-email-note" class="hint"></p>
<div class="field"><label for="register-challenge">申请编号</label><input id="register-challenge" minlength="20" maxlength="80" required autocomplete="off"><p class="hint">自动填写；重新打开页面后，可从验证码邮件中复制。</p></div>
<div class="field"><label for="register-code">邮箱验证码</label><input id="register-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code" placeholder="6 位数字"></div>
<div class="field"><label for="register-password">游戏登录密码</label><input id="register-password" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><p class="hint">8–128 个字符，进服后可使用 /login 登录。</p></div>
<div class="field"><label for="register-password-confirm">确认密码</label><input id="register-password-confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div>
<button id="register-verify" type="submit">验证并注册 →</button><button id="register-resend" class="secondary" type="button">重新发送验证码</button></form>
<div id="register-result" hidden><div class="register-success">✓</div><h2>注册成功</h2><p id="register-result-player" class="hint"></p><p id="register-result-email" class="hint"></p><p class="hint">邮箱已验证，欢迎加入社区。</p></div>
</section><p class="register-footer"><a href="/account-password" class="link">已有账号？设置 / 重置游戏登录密码 ↗</a></p><p class="register-footer">Myrinbot</p></main><script src="/register.js"></script></body></html>
