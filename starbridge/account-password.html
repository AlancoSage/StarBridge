<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>设置游戏登录密码 · 星桥</title><link rel="stylesheet" href="/panel.css"></head>
<body class="register-page"><main class="register-shell"><a class="register-brand" href="/register">✦ <span>星桥</span></a>
<section class="panel register-card"><p class="eyebrow">YOUR GAME ACCOUNT</p><h1>设置登录密码</h1><p class="muted register-caption">旧账号或忘记密码？验证注册邮箱后设置游戏密码。</p><div id="password-notice" class="notice" role="status"></div>
<form id="password-request-form"><div class="field"><label for="password-player">已注册玩家名</label><input id="password-player" minlength="3" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" required autocomplete="username"></div>
<div class="field"><label for="password-email">注册时使用的邮箱</label><input id="password-email" type="email" maxlength="254" required autocomplete="email"></div><button type="submit">发送邮箱验证码 →</button><button id="password-have-code" type="button" class="secondary">已有申请编号和验证码</button></form>
<form id="password-verify-form" hidden><div class="field"><label for="password-challenge">申请编号</label><input id="password-challenge" minlength="20" maxlength="80" required autocomplete="off"></div>
<div class="field"><label for="password-code">邮箱验证码</label><input id="password-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code"></div>
<div class="field"><label for="password-new">新游戏登录密码</label><input id="password-new" type="password" minlength="8" maxlength="128" required autocomplete="new-password"><p class="hint">8–128 个字符，在游戏内使用 /login 登录。</p></div>
<div class="field"><label for="password-confirm">确认新密码</label><input id="password-confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password"></div><button type="submit">验证并保存密码 →</button><button id="password-back" type="button" class="secondary">返回重新申请</button></form>
<div id="password-result" hidden><div class="register-success">✓</div><h2>密码已保存</h2><p class="hint">请重新进服，输入 /login &lt;新密码&gt; 或 /l &lt;新密码&gt;；已绑定 QQ 时也可使用 /qqlogin 或 /ql。</p></div>
</section><p class="register-footer"><a href="/register" class="link">还没有账号？前往注册 ↗</a></p><p class="register-footer">星桥 StarBridge · 让社群与游戏保持连接</p></main><script src="/account-password.js"></script></body></html>
