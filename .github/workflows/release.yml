name: Publish private version
on:
  push:
    branches: [main]
    paths: [starbridge/__init__.py]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: starbridge-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check version and existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from starbridge import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match Bot version' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release list' }
          $existing = ($releases | ConvertFrom-Json) | Where-Object { $_.tag_name -eq "v$version" -and -not $_.draft }
          if ($existing) { 'needed=false' >> $env:GITHUB_OUTPUT }
          else { 'needed=true' >> $env:GITHUB_OUTPUT }
      - name: Install locked dependencies and test
        if: steps.version.outputs.needed == 'true'
        run: |
          python -m pip install -r requirements.lock.txt
          python -m unittest discover -s tests -q
      - name: Build Java 8 bridge
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: ./bridge/build.ps1 -JavaHome $env:JAVA_HOME
      - name: Build Forge 1.20.1 bridge and test
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: ./bridge-forge/build.ps1 -JavaHome $env:JAVA_HOME
      - name: Build Java 8 Forge 1.7.10 / 1.12.2 / 1.16.5 bridges
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: python bridge-mods/build.py --java-home "$env:JAVA_HOME"
      - name: Build Forge 1.18.2 / 1.19.2 bridges and test
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: |
          ./bridge-forge-1.18.2/build.ps1 -JavaHome $env:JAVA_HOME
          ./bridge-forge-1.19.2/build.ps1 -JavaHome $env:JAVA_HOME
      - name: Build Fabric 1.16.5 / 1.18.2 / 1.19.2 / 1.20.1 / 1.21.1 bridges
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: python bridge-fabric/build.py --java-home "$env:JAVA_HOME"
      - uses: actions/setup-java@v4
        if: steps.version.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Build NeoForge 1.21.1 bridge and test
        if: steps.version.outputs.needed == 'true'
        shell: pwsh
        run: ./bridge-neoforge/build.ps1 -JavaHome $env:JAVA_HOME
      - name: Build and publish complete private release
        if: steps.version.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py --publish --repo "${{ github.repository }}" --commit "${{ github.sha }}"
