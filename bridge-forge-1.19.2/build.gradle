plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.43'
}
version = mod_version
group = 'cn.starbridge.forge'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.19.2'
    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods { starbridge { source sourceSets.main } }
        }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
tasks.named('processResources') {
    from(project.file(project.findProperty('starbridgeLicenseRoot') ?: '..')) {
        include 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'
        into 'META-INF/licenses/Myrinbot'
    }
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.register('copyBridge', Copy) {
    dependsOn 'build', 'reobfJar'
    from tasks.jar.archiveFile
    from(tasks.jar.archiveFile) { rename { name -> name.replaceFirst('^Myrinbot-', 'StarBridge-') } }
    into '../bridge/target'
}
