# QQ password recovery is opt-in in both this file and the bot panel.
# Place this JAR in the Velocity proxy plugins directory, not in a backend server.
enabled=false
endpoint=http://127.0.0.1:5800
# Existing backend server id and its bridge token from the bot panel.
server-id=survival
token=
# Exactly one authentication plugin must be installed: limboauth or librelogin.
engine=limboauth
