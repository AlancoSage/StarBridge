name: StarBridge
version: 0.5.1
main: cn.starbridge.StarBridgePlugin
# Intentionally uses Bukkit's legacy loader so pre-1.13 servers can load the same JAR.
# All version-sensitive calls are isolated in BukkitCompatibility.
folia-supported: true
description: QQ and Minecraft community bridge
author: StarBridge
softdepend: [AuthMe]
commands:
  login:
    description: Log in with the password registered on the website
    usage: /login <password>
    aliases: [l]
  qqlogin:
    description: Confirm this game login through the bound QQ account
    usage: /qqlogin
    aliases: [ql]
  qbind:
    description: Generate a QQ binding verification code
    usage: /qbind
    permission: starbridge.bind
permissions:
  starbridge.bind:
    default: true
