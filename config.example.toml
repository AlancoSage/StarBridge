# 运行 python -m starbridge init 自动生成带随机令牌的 config.toml。
# 所有 QQ 号、群号均使用字符串。推荐通过面板修改并保存设置。
# 面板保存业务设置后立即生效；监听地址、端口、数据库路径需要在面板中重启。
[app]
host = "127.0.0.1"
port = 5800
database = "data/starbridge.db"
admin_token = "CHANGE-ME-admin"

# 可选 MySQL：默认仍使用 app.database 的 SQLite 文件。
# 切换连接不自动迁移数据；已有数据见 docs/mysql.md。
[mysql]
enabled = false
host = "127.0.0.1"
port = 3306
database = "myrinbot"
user = "myrinbot"
password = ""
connect_timeout = 5
read_timeout = 5
write_timeout = 5
tls = false
ssl_ca = ""

[onebot]
# NapCat 等实现端配置反向 WebSocket：ws://127.0.0.1:5800/onebot/ws
token = "CHANGE-ME-onebot"
# 生产接入建议填写机器人 QQ 号；留空时采用连接头 X-Self-ID。
self_id = ""
admins = ["123456789"]

# 可选：QQ 官方群聊 / 单聊接入。启用后暂不接收 OneBot 连接。
# 群内 @机器人 发送「接入信息」，复制 qg: 群身份和 qug: 管理员身份。
[qq_official]
enabled = false
app_id = ""
client_secret = ""
admins = []
# 无有效回复消息时尝试主动发送；还需 QQ 平台对应权限与额度。
allow_active = false

# 只将下列指定指令的群内回复渲染成图片；预设指令填写“执行 命令名”。
[reply_images]
enabled = false
commands = []

[features]
qq_to_mc = true
mc_to_qq = true
join_quit = true
unbind_on_leave = false
set_group_card = false

# 首次启动导入到「扩展 → 关键词回复」插件，此后仅保留为迁移备份。
[replies]
"官网" = "欢迎来到服务器！请在面板「扩展 → 关键词回复 → 管理回复」中设置你的官网地址。"
"规则" = "友善交流，禁止作弊与恶意破坏。"

[[servers]]
id = "survival"
name = "生存服"
token = "CHANGE-ME-bridge"
groups = ["987654321"]

# 仅 onebot.admins 中的 QQ 可通过“执行 在线检查”调用。
# 命令内容由本地配置决定，不接受群消息拼接的任意控制台命令。
[servers.commands]
"在线检查" = "list"
"性能检查" = "tps"
